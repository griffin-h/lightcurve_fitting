[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lightcurve-fitting"
description = "Tools to fit analytical models to multiband light curves of astronomical transients"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "GNU General Public License v3 (GPLv3)"}
authors = [
    {name = "Griffin Hosseinzadeh", email = "ghosseinzadeh@ucsd.edu"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
]
dynamic = ["version"]

dependencies = [
    "numpy",
    "matplotlib",
    "emcee >= 3.1.1",
    "corner",
    "astropy >= 5",
    "scipy",
    "extinction",
]

[project.optional-dependencies]
dev = [
    # These are required for developing the package (running the tests, building
    # the documentation) but not necessarily required for _using_ it.
    "codecov",
    "coverage",
    "flake8",
    "pytest",
    "sphinx",
    # These are dependencies of various sphinx extensions for documentation.
    "ipython",
    "matplotlib",
    "numpydoc",
    "sphinx-copybutton",
    "sphinx_rtd_theme",
]

[project.urls]
Homepage = "https://github.com/griffin-h/lightcurve_fitting"

[tool.setuptools.packages.find]
exclude = ["docs", "tests"]

[tool.setuptools.package-data]
lightcurve_fitting = [
    "example/SN2016bkv.txt",
    "filters/*",
    "models/sifto.dat",
    "serif.mplstyle",
]

[tool.setuptools_scm]
# writes a version file at build time — optional but convenient at runtime
version_file = "lightcurve_fitting/_version.py"